<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141614">
  <meta name="description" content="당신의 하루에 어울리는 사운드. 나만의 플레이리스트를 만들고 음악을 모아보세요.">
  <title>offbeat — 너만의 리듬으로</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#home" aria-label="offbeat 홈"><span class="brand-symbol">ııı</span>offbeat<span class="brand-dot">®</span></a>
    <p class="side-label">YOUR DAILY SOUNDTRACK</p>
    <nav aria-label="메인 메뉴">
      <button class="nav-item active" data-view="home"><span>⌂</span> 둘러보기</button>
      <button class="nav-item" data-view="library"><span>▤</span> 내 플레이리스트</button>
      <button class="nav-item" data-view="likes"><span>♡</span> 좋아요한 음악 <small id="like-count">0</small></button>
    </nav>
    <div class="side-divider"></div>
    <div class="side-heading"><p class="side-label">MY PLAYLISTS</p><button class="icon-btn" data-action="create" aria-label="플레이리스트 만들기">＋</button></div>
    <div id="sidebar-playlists"></div>
    <button class="new-list" data-action="create">＋ 새 플레이리스트</button>
    <div class="side-bottom"><span class="status-dot"></span> 음악과 조금 더 가까이.<br><small>Made for your kind of days.</small></div>
  </aside>

  <div class="page">
    <header class="topbar">
      <div class="breadcrumb">YOUR SPACE <span>/</span> <b id="breadcrumb">둘러보기</b></div>
      <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="음악, 아티스트, 플레이리스트 검색" aria-label="음악, 아티스트, 플레이리스트 검색"><kbd>/</kbd></label>
      <div class="profile" title="이 브라우저의 로컬 보관함">J<span></span></div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="page-footer"><span>offbeat®</span><span>A little less noise. A little more you.</span><span>LOCAL MUSIC SPACE · 2026</span></footer>
  </div>

  <section class="player" aria-label="음악 플레이어">
    <div class="now-playing"><div id="player-cover" class="cover art art-0 mini-cover"><span>o.</span></div><div class="track-copy"><strong id="player-title">음악을 골라보세요</strong><span id="player-artist">오늘의 리듬을 시작할 시간</span></div><button id="player-like" class="icon-btn" aria-label="현재 곡 좋아요" disabled>♡</button></div>
    <div class="playback"><div class="playback-buttons"><button id="shuffle" class="icon-btn" aria-label="셔플" aria-pressed="false">⤨</button><button id="previous" class="icon-btn" aria-label="이전 곡">◀</button><button id="play" class="play-button" aria-label="재생">▶</button><button id="next" class="icon-btn" aria-label="다음 곡">▶</button><button id="repeat" class="icon-btn" aria-label="반복 재생" aria-pressed="false">↻</button></div><div class="timeline"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="재생 위치" disabled><span id="duration">0:00</span></div></div>
    <div class="player-extra"><button id="mute" class="icon-btn" aria-label="음소거" aria-pressed="false">◖))</button><input id="volume" type="range" min="0" max="1" value="0.7" step="0.01" aria-label="음량"><span class="audio-tag">STEREO</span></div>
  </section>
  <audio id="audio" preload="metadata"></audio>
  <input id="file-input" type="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac" multiple hidden>
  <dialog id="playlist-dialog">
    <form id="playlist-form"><div class="dialog-heading"><span class="eyebrow">MAKE IT YOURS</span><button class="icon-btn" type="button" data-action="close-dialog" aria-label="닫기">×</button></div><h2 id="dialog-title">새 플레이리스트</h2><label>이름<input id="playlist-name" required maxlength="60" placeholder="어떤 순간을 담을까요?"></label><label>설명<textarea id="playlist-description" maxlength="200" rows="3" placeholder="이 플레이리스트를 한 줄로 소개해주세요."></textarea></label><label>커버 컬러<select id="playlist-color"><option value="0">오렌지 선셋</option><option value="1">올리브 그루브</option><option value="2">라일락 드림</option><option value="3">블루 아워</option><option value="4">로즈 가든</option><option value="5">샌드 스튜디오</option></select></label><button class="primary-btn" type="submit">플레이리스트 저장 <span>↗</span></button></form>
  </dialog>
  <dialog id="add-dialog"><div class="dialog-heading"><span class="eyebrow">ADD TO PLAYLIST</span><button class="icon-btn" data-action="close-add" aria-label="닫기">×</button></div><h2>어디에 담을까요?</h2><div id="add-options"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
